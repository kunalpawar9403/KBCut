name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Node Dependencies
      run: npm ci

    - name: Build Web Production Assets
      run: npm run build

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Grant Execute Permission for Gradlew
      run: chmod +x android/gradlew

    - name: Build Android APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk ../kbcut-app.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kbcut-android-apk
        path: kbcut-app.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "KBCut Android App v1.0.0"
        body: |
          ### KBCut - Photo & PDF Size Reducer (Android APK)
          - ⚡ 100% Offline client-side photo & PDF compression
          - 🎯 Tailored presets for SSC, UPSC, MPSC, Aadhaar, PAN, IBPS
          - 🔒 100% Private, zero cloud uploads

          **Download APK below:**
        files: kbcut-app.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
