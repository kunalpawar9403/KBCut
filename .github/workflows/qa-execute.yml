name: QA Execute (Playwright)

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build app
        run: npm run build --if-present
      - name: Install Playwright
        run: |
          npm ls @playwright/test >/dev/null 2>&1 || npm i --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve built app on :4173
        run: |
          DIR=.
          for d in dist build out; do [ -f "$d/index.html" ] && DIR=$d && break; done
          nohup npx --yes serve -s "$DIR" -l 4173 > /tmp/serve.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 60000
      - name: Run Playwright tests (e2e folder only, never unit tests)
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          cat > qa.playwright.config.mjs <<'EOF2'
          export default {
            testDir: process.env.QA_TEST_DIR || 'tests/e2e',
            testMatch: /.*\.(spec|test)\.[cm]?[jt]sx?$/,
            timeout: 30000,
            reporter: [['list'], ['html', { open: 'never' }]],
            use: {
              baseURL: process.env.BASE_URL,
              trace: 'on',
              screenshot: 'on',
              video: 'on',
            },
          };
          EOF2
          npx playwright test -c qa.playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
