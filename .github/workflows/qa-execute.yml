name: Playwright QA Automation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch or commit SHA to test'
        required: false
        default: 'main'
      correlation_id:
        description: 'n8n workflow correlation ID'
        required: false
        default: 'manual'
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
      callback_url:
        description: 'n8n callback webhook URL'
        required: false
        default: ''

jobs:
  playwright-qa:
    name: Execute Playwright Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      statuses: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build
          npx vite preview --port 4173 &
          sleep 3

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        id: test_runner
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: 'http://localhost:4173'
        run: |
          npx playwright test --project=chromium

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Strict Outcome Check
        if: steps.test_runner.outcome != 'success'
        run: |
          echo "Playwright tests failed."
          exit 1
