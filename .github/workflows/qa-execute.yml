name: Playwright QA Automated Runner

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch or ref to execute tests on'
        required: false
        default: 'main'
      correlation_id:
        description: 'Execution tracking correlation ID'
        required: false
        default: 'manual_run'
      environment:
        description: 'Target test environment'
        required: false
        default: 'staging'
      callback_url:
        description: 'Optional callback URL to notify n8n upon completion'
        required: false
        default: ''

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "Initializing minimal Playwright project..."
            npm init -y
            npm install -D @playwright/test typescript @types/node
          fi

      - name: Ensure Playwright Configuration Exists
        run: |
          if [ ! -f playwright.config.ts ] && [ ! -f playwright.config.js ]; then
            echo "Creating minimal playwright.config.ts..."
            cat << 'EOF' > playwright.config.ts
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            timeout: 30000,
            retries: 1,
            reporter: [['html', { open: 'never' }], ['json', { outputFile: 'test-results/results.json' }], ['list']],
            use: {
              baseURL: process.env.BASE_URL || 'http://localhost:4173',
              trace: 'on-first-retry',
              screenshot: 'only-on-failure',
            },
            projects: [{ name: 'chromium', use: { ...devices['Desktop Chrome'] } }],
          });
          EOF
          fi

      - name: Build Application & Start Server
        run: |
          if grep -q '"build"' package.json 2>/dev/null; then
            echo "Building frontend..."
            npm run build || true
          fi
          if grep -q '"preview"' package.json 2>/dev/null; then
            echo "Starting Vite preview on port 4173..."
            npx vite preview --port 4173 &
          elif [ -d dist ]; then
            npx serve -s dist -l 4173 &
          elif [ -d build ]; then
            npx serve -s build -l 4173 &
          fi
          sleep 4
        continue-on-error: true

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run Playwright Tests
        id: run_tests
        run: |
          mkdir -p playwright-report test-results
          npx playwright test --reporter=json,html > test-output.log 2>&1 || true
        env:
          CI: true
          BASE_URL: 'http://localhost:4173'
          CORRELATION_ID: ${{ github.event.inputs.correlation_id }}

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.event.inputs.correlation_id || github.run_id }}
          path: |
            playwright-report/
            test-results/
            test-output.log
          retention-days: 7
